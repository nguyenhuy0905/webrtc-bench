[workspace]
resolver = "3"
members = ["peer", "signal"]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
webrtc = "0.20"
tokio = { version = "1", features = ["full"] }
log = "0.4"
serde_json = "1"
base64 = { version = "0.23", features = ["simd-unsafe"] }
async-trait = "0.1"
anyhow = "1"
hyper = { version = "1", features = ["http1", "client", "server"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
dashmap = { version = "6.2", features = ["inline"] }
