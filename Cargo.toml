[workspace]
resolver = "3"
members = ["common","peer", "signal"]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
webrtc = "0.20"
tokio = { version = "1", features = ["full"] }
log = "0.4"
serde = "1"
serde_json = "1"
base64 = { version = "0.23", features = ["simd-unsafe"] }
async-trait = "0.1"
anyhow = "1"
matchbox_signaling = "0.14"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dashmap = { version = "6.2", features = ["inline"] }
