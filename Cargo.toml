[workspace]
resolver = "3"
members = ["common","peer", "signal"]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
webrtc = "0.20"
rtc = "0.20"
tokio = { version = "1", features = ["full"] }
log = "0.4"
serde = "1"
futures = "0.3"
futures-util = "0.3"
serde_json = "1"
async-trait = "0.1"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
dashmap = { version = "6.2", features = ["inline"] }
tokio-tungstenite = "0.30"
uuid = { version = "1", features = ["v4", "serde"] }
ctrlc = "3"
rand = "0.10"
anyhow = "1"
