[workspace]
resolver = "3"
members = ["peer"]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
webrtc = "0.20"
tokio = { version = "1", features = ["full"] }
log = "0.4"
serde_json = "1.0"
base64 = { version = "0.23", features = ["simd-unsafe"] }
async-trait = "0.1"
anyhow = "1.0"
